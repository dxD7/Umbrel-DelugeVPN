version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: dxd7-deluge-vpn_deluge-vpn_1
      APP_PORT: 8112
      # Deluge's own web password is the login (change the default!).
      # Remove this line to also put Umbrel's login in front of Deluge.
      PROXY_AUTH_ADD: "false"

  deluge-vpn:
    # Follows binhex's 2.2 release line (not "latest"), so a future major
    # version can't change things unexpectedly.
    image: binhex/arch-delugevpn:2.2
    # binhex documents that WireGuard needs privileged mode + the sysctl below.
    # If you only use OpenVPN you can replace "privileged: true" with:
    #   cap_add:
    #     - NET_ADMIN
    # (binhex's OpenVPN examples use only NET_ADMIN - untested here.)
    privileged: true
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    # No ports are published to your network on purpose: the web UI is reached
    # through Umbrel's app proxy, and other Umbrel apps can reach Deluge over
    # Umbrel's internal Docker network. If you really need direct LAN access to
    # Privoxy or the Deluge daemon, uncomment what you need (and set
    # ENABLE_PRIVOXY=yes in data/vpn.env for Privoxy):
    # ports:
    #   - "8118:8118"     # Privoxy
    #   - "58846:58846"   # Deluge daemon
    volumes:
      - ${APP_DATA_DIR}/data:/config
      - ${UMBREL_ROOT}/data/storage/downloads:/data
      - /etc/localtime:/etc/localtime:ro
    # User-editable settings: Apps/dxd7-deluge-vpn/data/vpn.env (Umbrel Files app)
    env_file:
      - ${APP_DATA_DIR}/data/vpn.env
    # Fixed settings. VPN_ENABLED is deliberately NOT user-editable so the
    # app can never silently run without the VPN and kill switch.
    environment:
      - VPN_ENABLED=yes
      - DELUGE_DAEMON_LOG_LEVEL=info
      - DELUGE_WEB_LOG_LEVEL=info
      - DEBUG=false
      - UMASK=002
      - PUID=1000
      - PGID=1000
    restart: unless-stopped
